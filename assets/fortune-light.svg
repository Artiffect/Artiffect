<svg xmlns="http://www.w3.org/2000/svg" width="495" height="166" viewBox="0 0 495 166">
  <style>
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; white-space: pre; }
    .t { font-size: 14px; }
    .out { opacity: 0; animation: show .01s linear forwards; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .out, .cover, .cursor { animation: none !important; }
      .out { opacity: 1; }
      .cover { display: none; }
    }
  </style>
  <rect x="1" y="1" width="493" height="164" rx="10" fill="#ffffff"/>
  <path d="M1 32V11A10 10 0 0 1 11 1H484A10 10 0 0 1 494 11V32Z" fill="#ececec"/>
  <line x1="1" y1="32.5" x2="494" y2="32.5" stroke="#d0d0d0"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="248" y="21" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6a6a6a">fortune</text>
  <text class="m t" x="18.0" y="60" xml:space="preserve"><tspan fill="#c8458a" font-weight="700">❯ </tspan><tspan fill="#1f1f1f">fortune dev</tspan></text>
  <text class="m out" x="34.0" y="94" xml:space="preserve" font-size="16" style="animation-delay: 0.20s"><tspan fill="#1f1f1f" font-weight="700">The best way to predict the future is to</tspan></text>
  <text class="m out" x="34.0" y="118" xml:space="preserve" font-size="16" style="animation-delay: 0.20s"><tspan fill="#1f1f1f" font-weight="700">invent it.</tspan></text>
  <text class="m out" x="34.0" y="144" xml:space="preserve" font-size="13" style="animation-delay: 0.35s"><tspan fill="#7b5fb5">— Alan Kay</tspan></text>
  <rect class="out" x="18" y="78" width="3" height="70" rx="1.5" fill="#c8458a" style="animation-delay: .2s"/>
  <rect x="1" y="1" width="493" height="164" rx="10" fill="none" stroke="#d0d0d0"/>
</svg>