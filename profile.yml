# 프로필 README에 들어가는 글자 설정.
# 이 파일만 고쳐서 커밋하면 GitHub Actions가 SVG를 다시 그려요.
# {중괄호} 값은 GitHub 데이터로 자동 채워져요: {uptime} {commits} {repos} {followers} {contribs}

github: Artiffect          # GitHub 아이디 (데이터를 가져올 계정)

# 상단 터미널: 파워라인 프롬프트 칸
prompt:
  user: artiffect
  path: ~/github
  branch: main

# 상단 터미널: neofetch 오른쪽 정보 (위에서부터 순서대로, 줄 추가·삭제 가능)
neofetch:
  Role: Backend Developer
  Uptime: "{uptime} on GitHub"
  Commits: "{commits}"
  Repos: "{repos}"
  Lang: Java, Kotlin, TypeScript
  Backend: Spring Boot, JPA, QueryDSL
  Data: MySQL, PostgreSQL, Redis, Kafka
  Infra: Docker, Kubernetes, AWS
  Blog: artiffect.github.io
  Motto: Solo pensemos en lo bueno.

# 기술 스택 (01 tech stack). 카테고리 이름과 항목을 자유롭게 바꾸고 추가·삭제할 수 있어요.
# 이름을 보고 아이콘을 자동으로 붙여요 (예: TypeScript → ts). 아이콘이 없는 기술은 이름만 나와요.
stack:
  languages:  [Java, Kotlin, TypeScript, React]
  backend:    [Spring Boot, Spring Security, JPA, QueryDSL, Gradle]
  database:   [MySQL, PostgreSQL, Redis, Elasticsearch]
  messaging:  [Kafka, WebSocket]
  infra:      [Docker, Kubernetes, AWS, Nginx, GitHub Actions]
  monitoring: [Prometheus, Grafana]
  test:       [JUnit5, Mockito, Testcontainers, WireMock, k6]

# 섹션 제목 (번호 01, 02 ... 는 순서대로 자동으로 붙어요)
sections:
  - { title: tech stack,   path: ~/stack }
  - { title: github stats, path: ~/stats }
  - { title: activity,     path: ~/activity }
  - { title: git log,      path: ~/commits }
  - { title: spotify,      path: ~/spotify }

# btop 프로세스 목록에서 뺄 저장소
btop_exclude:
  - github-action-test

# 맨 아래 마무리 창 문구
footer: Thanks for visiting. See you around!
